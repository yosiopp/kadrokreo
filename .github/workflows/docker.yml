# Docker イメージのビルド確認と、GHCR への公開。
# - verify: すべての push（main・v* タグ）と PR で、イメージを作り、viewer・--editor・kdr コマンドが動くか確かめる
# - publish: main への push と v* タグの push のときだけ、verify が通ってから ghcr.io/<owner>/kadrokreo に push する
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: イメージを作る
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kadrokreo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: viewer と --editor が HTTP で応答する
        run: |
          docker run -d --name kdr-viewer -p 8091:80 kadrokreo:ci
          docker run -d --name kdr-editor -p 8092:80 kadrokreo:ci --editor
          for url in http://localhost:8091/ http://localhost:8092/; do
            ok=
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null "$url"; then ok=1; break; fi
              sleep 1
            done
            if [ -z "$ok" ]; then
              echo "応答がありません: $url"
              docker logs kdr-viewer; docker logs kdr-editor
              exit 1
            fi
            echo "応答あり: $url"
          done
          docker logs kdr-viewer 2>&1 | grep 'serving viewer mode'
          docker logs kdr-editor 2>&1 | grep 'serving editor mode'

      - name: イメージの kdr コマンドで kdr と PNG を作れる
        run: |
          docker run --rm kadrokreo:ci kdr new + add rect --name Box > demo.kdr
          docker run --rm -i kadrokreo:ci kdr -f - ls < demo.kdr | tee ls.txt
          grep -q '"Box"' ls.txt
          docker run --rm -i kadrokreo:ci kdr -f - png --to - < demo.kdr > demo.png
          # PNG の先頭 8 バイト（\x89PNG\r\n\x1a\n）
          test "$(head -c 8 demo.png | od -An -tx1 | tr -d ' \n')" = 89504e470d0a1a0a
          docker image inspect kadrokreo:ci --format 'イメージの大きさ: {{.Size}}'

      - name: 後片付け
        if: always()
        run: docker rm -f kdr-viewer kdr-editor || true

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # main → edge、v1.2.3 のタグ → 1.2.3・1.2・latest、どちらも sha-<短い sha>
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kadrokreo
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # verify と同じ GHA キャッシュを使うので、ほとんど作り直さない
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Docker イメージのビルド確認と、GHCR への公開。
# - verify: すべての push（main・v* タグ）と PR で、イメージを作り、viewer・--editor・kdr コマンドが動くか確かめ、起動したイメージを相手に e2e を流す
# - publish: main への push と v* タグの push のときだけ、verify が通ってから ghcr.io/yosiopp/kadrokreo（フォークでは ghcr.io/<フォークの持ち主>/kadrokreo） に push する
# - release: v* タグの push のときだけ、publish が終わってから GitHub Releases を作る（本文は scripts/release-notes.sh）
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # タグを push したとき: タグと、package.json などに書いた版が同じか。ずれていたらここで止まり、publish と release に進まない
      - name: 版の表記がタグと揃っているか
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.mjs check "$GITHUB_REF_NAME"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: イメージを作る
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kadrokreo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: viewer と --editor が HTTP で応答する
        run: |
          docker run -d --name kdr-viewer -p 8091:80 kadrokreo:ci
          docker run -d --name kdr-editor -p 8092:80 kadrokreo:ci --editor
          for url in http://localhost:8091/ http://localhost:8092/; do
            ok=
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "$url"; then ok=1; break; fi
              sleep 1
            done
            if [ -z "$ok" ]; then
              echo "応答がありません: $url"
              docker logs kdr-viewer; docker logs kdr-editor
              exit 1
            fi
            echo "応答あり: $url"
          done
          docker logs kdr-viewer 2>&1 | grep 'serving viewer mode'
          docker logs kdr-editor 2>&1 | grep 'serving editor mode'

      - name: イメージの kdr コマンドで kdr と PNG を作れ、docs と help を出せる
        run: |
          docker run --rm kadrokreo:ci kdr new + add rect --name Box > demo.kdr
          docker run --rm -i kadrokreo:ci kdr -f - ls < demo.kdr | tee ls.txt
          grep -q '"Box"' ls.txt
          # エージェント向けのリファレンスとコマンドごとのヘルプ
          docker run --rm kadrokreo:ci kdr docs | grep -q '^# kdr リファレンス'
          docker run --rm kadrokreo:ci kdr set --help | grep -q '^kdr set '
          docker run --rm -i kadrokreo:ci kdr -f - png --to - < demo.kdr > demo.png
          # PNG の先頭 8 バイト（\x89PNG\r\n\x1a\n）
          test "$(head -c 8 demo.png | od -An -tx1 | tr -d ' \n')" = 89504e470d0a1a0a
          docker image inspect kadrokreo:ci --format 'イメージの大きさ: {{.Size}}'

      # ここから下は、起動したままの 2 つのコンテナを相手にした e2e。ci.yml の e2e は Vite の開発サーバーが相手なので、
      # nginx の配信の設定と CSP、本番のビルドだけで起きる退行はここでしか拾えない（CSP 違反はコンソールエラーになり、e2e が落ちる）。
      # Node・Chrome・書体の用意は ci.yml と同じ
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Chrome と日本語の書体
        run: |
          google-chrome --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - run: npm ci

      - name: イメージの viewer と editor を相手に e2e を流す
        env:
          VIEWER_URL: http://localhost:8091
          EDITOR_URL: http://localhost:8092
        run: npm run e2e

      - name: e2e の出力を残す（失敗したとき）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-out-image
          path: e2e/out/
          retention-days: 7
          if-no-files-found: ignore

      - name: 後片付け
        if: always()
        run: docker rm -f kdr-viewer kdr-editor || true

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # main → edge、v1.2.3 のタグ → 1.2.3・1.2・latest、どちらも sha-<短い sha>
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/kadrokreo
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # verify と同じ GHA キャッシュを使うので、ほとんど作り直さない
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # イメージの push が終わってから作るので、本文のリンク先のイメージは必ず存在する
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # 変更点を前のタグから集めるので、履歴とタグをすべて取る
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 同じタグのリリースが既にあれば（再実行など）本文とタイトルだけ更新する。- を含むタグはプレリリース
      - name: GitHub Releases を作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          scripts/release-notes.sh "$TAG" > release-notes.md
          cat release-notes.md
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md ${prerelease:+"$prerelease"}
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md ${prerelease:+"$prerelease"}
          fi

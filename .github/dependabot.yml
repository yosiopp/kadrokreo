version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # minor・patch はまとめて 1 つの PR に。major は依存ごとに別の PR
      npm-minor-patch:
        update-types: [minor, patch]

  # ワークフローの外部 action はコミットの SHA で固定している（uses: …@<sha> # vX.Y.Z）。SHA とコメントの版をここが上げる
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

server {
    listen 80;
    server_name _;

    # entrypoint.sh が viewer か editor のどちらかへ向ける
    root /srv/kadrokreo/current;
    index index.html;

    # 外部の kdr ファイルを開くアプリなので、スクリプトや通信先は自分自身だけに絞る
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # ファイル名にハッシュが入るので長期キャッシュしてよい
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
